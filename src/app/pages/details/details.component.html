<div class="details-container">
    <div class="details-header">
        <button type="button" class="back-btn" (click)="goBack()">
            <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to List
        </button>
        <h1 class="page-title">User Details</h1>
        <div class="nav-buttons">
            <button type="button" class="nav-btn" (click)="goPrev()" [disabled]="currentIndex === 0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Prev
            </button>
            <span class="nav-counter">{{currentIndex + 1}} / {{totalUsers}}</span>
            <button type="button" class="nav-btn" (click)="goNext()" [disabled]="currentIndex === totalUsers - 1">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <div class="details-content" *ngIf="user">
        <div class="user-profile-card">
            <div class="profile-header">
                <div class="avatar-large">
                    {{user.name?.charAt(0).toUpperCase()}}
                </div>
                <div class="profile-info">
                    <h2 class="user-name">{{user.name}}</h2>
                    <p class="user-subtitle">Customer Profile</p>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Phone Number</span>
                        <span class="detail-value">{{user.phone_number}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Register Number</span>
                        <span class="detail-value">{{user.register_number}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Due Date</span>
                        <span class="detail-value">{{user.due_date}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Model</span>
                        <span class="detail-value">{{user.model}}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Send Message Card -->
        <div class="message-card">
            <div class="message-card-header">
                <svg class="message-card-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
                <h3 class="message-card-title">Send Message</h3>
            </div>

            <div class="message-body">
                <div class="template-options">
                    <label class="template-option">
                        <input type="radio" name="template" value="renewal" [(ngModel)]="selectedTemplate">
                        <span>Insurance Renewal Reminder</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="unreachable" [(ngModel)]="selectedTemplate">
                        <span>Unreachable Customer</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="thankyou" [(ngModel)]="selectedTemplate">
                        <span>Thank You Message</span>
                    </label>
                    <label class="template-option">
                        <input type="radio" name="template" value="custom" [(ngModel)]="selectedTemplate">
                        <span>Custom Message</span>
                    </label>
                </div>

                <div class="message-preview">
                    <textarea class="message-textarea" [readonly]="selectedTemplate !== 'custom'"
                        [ngModel]="messageText" (ngModelChange)="customMessage = $event"
                        placeholder="Message will appear here..." rows="4">
                    </textarea>
                    <span class="char-count">{{charCount}} / 336 characters</span>
                </div>
            </div>

            <div class="message-actions">
                <button type="button" class="send-btn sms-btn" (click)="sendSms()">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                    </svg>
                    Send via SMS
                </button>
                <button type="button" class="send-btn whatsapp-btn" (click)="sendWhatsApp()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" />
                        <path
                            d="M12 0C5.373 0 0 5.373 0 12c0 2.123.554 4.118 1.528 5.855L.057 23.882l6.186-1.443A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.891 0-3.667-.502-5.2-1.378l-.373-.22-3.673.857.896-3.567-.242-.386A9.944 9.944 0 012 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z" />
                    </svg>
                    Send via WhatsApp
                </button>
            </div>
        </div>

    </div>
</div>
