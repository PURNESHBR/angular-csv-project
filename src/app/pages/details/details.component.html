<div class="details-container">
    <div class="details-header">
        <button type="button" class="back-btn" (click)="goBack()">
            <svg class="back-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to List
        </button>
        <h1 class="page-title">User Details</h1>
        <div class="nav-buttons">
            <button type="button" class="nav-btn" (click)="goPrev()" [disabled]="currentIndex === 0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                Prev
            </button>
            <span class="nav-counter">{{currentIndex + 1}} / {{totalUsers}}</span>
            <button type="button" class="nav-btn" (click)="goNext()" [disabled]="currentIndex === totalUsers - 1">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <div class="details-content" *ngIf="user">
        <div class="user-profile-card">
            <div class="profile-header">
                <div class="avatar-large">
                    {{user.name?.charAt(0).toUpperCase()}}
                </div>
                <div class="profile-info">
                    <h2 class="user-name">{{user.name}}</h2>
                    <p class="user-subtitle">Customer Profile</p>
                </div>
            </div>

            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Phone Number</span>
                        <span class="detail-value">{{user.phone_number}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Register Number</span>
                        <span class="detail-value">{{user.register_number}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Due Date</span>
                        <span class="detail-value">{{user.due_date}}</span>
                    </div>
                </div>

                <div class="detail-item">
                    <div class="detail-icon-wrapper">
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                        </svg>
                    </div>
                    <div class="detail-content">
                        <span class="detail-label">Model</span>
                        <span class="detail-value">{{user.model}}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
