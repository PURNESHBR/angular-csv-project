<div class="list-container">
  <div class="list-header">
    <div class="header-content">
      <div class="title-section">
        <h2>
          <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          User Directory
        </h2>
        <p class="subtitle">{{users.length}} users registered</p>
      </div>
      <div class="controls-group">
        <div class="filter-box">
          <svg class="filter-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2a1 1 0 01-.293.707L13 13.414V19a1 1 0 01-.553.894l-4 2A1 1 0 017 21v-7.586L3.293 6.707A1 1 0 013 6V4z" />
          </svg>
          <select class="filter-select" aria-label="Filter by field" [(ngModel)]="filterField" (change)="applyFilter()">
            <option value="all">All Fields</option>
            <option value="name">Name</option>
            <option value="phone_number">Phone</option>
            <option value="register_number">Register No.</option>
            <option value="due_date">Due Date</option>
            <option value="model">Model</option>
          </select>
        </div>
        <div class="search-box">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" placeholder="Search users..." class="search-input" [(ngModel)]="searchTerm"
            (input)="filterUsers()">
        </div>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-container">
      <table class="user-table">
        <thead>
          <tr>
            <th class="col-avatar">Avatar</th>
            <th class="col-name">Name</th>
            <th class="col-phone">Phone Number</th>
            <th class="col-register">Register Number</th>
            <th class="col-action">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of filteredUsers; let i = index" class="table-row"
            (click)="openDetails(getOriginalIndex(user))">
            <td class="col-avatar">
              <div class="avatar" [style.background]="getAvatarColor(i)">
                {{user.name.charAt(0).toUpperCase()}}
              </div>
            </td>
            <td class="col-name">
              <span class="user-name-text">{{user.name}}</span>
            </td>
            <td class="col-phone">
              <div class="phone-wrapper">
                <svg class="phone-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                </svg>
                {{user.phone_number}}
              </div>
            </td>
            <td class="col-register">
              <span class="register-badge" [style.background]="getAvatarColor(i)">
                {{user.register_number}}
              </span>
            </td>
            <td class="col-action">
              <button type="button" class="view-btn"
                (click)="openDetails(getOriginalIndex(user)); $event.stopPropagation()">
                View Details
                <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div *ngIf="filteredUsers.length === 0" class="empty-state">
      <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <p class="empty-text">No users found</p>
      <p class="empty-subtext">Try adjusting your search</p>
    </div>
  </div>
</div>
